# Nginx reverse proxy สำหรับแอป (ส่วนที่ 5)
#
# ติดตั้งบน VPS (root) — แทน example.com ด้วยโดเมนของตัวเอง:
#   sed 's/example\.com/<โดเมน>/g' /home/deploy/app/nginx.conf > /etc/nginx/sites-available/equipment
#   ln -s /etc/nginx/sites-available/equipment /etc/nginx/sites-enabled/
#   rm /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# HTTPS: certbot --nginx -d <โดเมน> -d www.<โดเมน> --redirect
#        (certbot จะแก้ไฟล์บน VPS เพิ่ม listen 443 และ redirect ให้เอง)

server {
    # รับ HTTP ทั้ง IPv4 และ IPv6
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    location / {
        # ส่งต่อให้แอปใน Docker (APP_PORT=127.0.0.1:3300 ใน .env)
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        # ส่งชื่อโดเมน, IP จริงของผู้ใช้ และ http/https ไปให้แอป
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
