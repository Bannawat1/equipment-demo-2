#
# ===================================================================
# Nginx reverse proxy
# ===================================================================
# บน VPS: Nginx รับ request ที่ port 80/443 ของโดเมน แล้วส่งต่อ (proxy) ไปยังแอป
# ที่รันอยู่ใน Docker (port ตาม APP_PORT ใน .env)
#
# เอกสารที่ควรอ่าน:
#   - ngx_http_proxy_module: https://nginx.org/en/docs/http/ngx_http_proxy_module.html
#   - Certbot (Let's Encrypt): https://certbot.eff.org/instructions
#
# สิ่งที่ไฟล์นี้ต้องมี:
#   [ ] server block ที่ฟัง port 80
#   [ ] server_name = โดเมนจริงของนิสิต
#   [ ] location ที่ proxy_pass ไปยัง port ของแอป
#   [ ] ส่ง header ที่จำเป็นต่อให้แอป (เช่น Host และ IP จริงของผู้ใช้)
#
# คำใบ้:
#   - ไฟล์นี้มักวางไว้ที่ /etc/nginx/sites-available/ แล้ว symlink ไป sites-enabled/
#   - ทดสอบ config ก่อน reload ทุกครั้ง: sudo nginx -t
#   - HTTPS ไม่ต้องเขียนเอง: เมื่อ HTTP ใช้งานได้แล้วให้รัน certbot --nginx
#     certbot จะแก้ไฟล์นี้เพิ่ม listen 443 / ssl_certificate และ redirect จาก HTTP ให้
#   - ถ้าแอปเปิด port 3000 ไว้กับทุก interface ผู้ใช้จะเข้าตรงได้โดยไม่ผ่าน Nginx
#     ลองคิดว่าควรจำกัดอย่างไร (firewall หรือการ bind port ใน .env / compose)
